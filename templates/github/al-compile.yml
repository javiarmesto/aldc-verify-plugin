# AL compile (L1) + code analyzers (L2) with the symbols versioned in .alpackages.
# Generated by aldc-verify init. The compiler version comes from .claude/aldc-verify.json (compiler.alTool).
name: AL compile

on:
  push:
    branches: [{{DEFAULT_BRANCH}}]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AL compiler (dotnet tool al)
        shell: bash
        run: |
          AL_TOOL=$(node -e "try{process.stdout.write(require('./.claude/aldc-verify.json').compiler.alTool||'')}catch(e){}")
          dotnet tool install --global Microsoft.Dynamics.BusinessCentral.Development.Tools --version "${AL_TOOL:-{{AL_TOOL}}}"

      - name: Get aldc-verify {{PLUGIN_REF}}
        shell: bash
        run: git clone --depth 1 --branch {{PLUGIN_REF}} https://github.com/javiarmesto/aldc-verify-plugin "$RUNNER_TEMP/aldc-verify"

      - name: Compile and analyze
        shell: bash
        run: |
          # Exit codes: 0 no errors, 1 errors, 3 not-run (no compiler or symbols): only 0 passes.
          node "$RUNNER_TEMP/aldc-verify/scripts/al-verify.js" > "$RUNNER_TEMP/al-verify.txt" 2>&1 && code=0 || code=$?
          cat "$RUNNER_TEMP/al-verify.txt"
          { echo '```'; cat "$RUNNER_TEMP/al-verify.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al-verify-report
          path: .claude/.aldc-verify/last-report.json
          if-no-files-found: ignore
